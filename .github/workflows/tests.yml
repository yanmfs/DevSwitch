name: macOS tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulated-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install local command without runtime dependencies
        run: |
          python install.py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run simulated providers and real terminal/process tests
        run: ./.venv/bin/python -m unittest discover -s tests -v
      - name: Verify offline demo
        run: devswitch demo
